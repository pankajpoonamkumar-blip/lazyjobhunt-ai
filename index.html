<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LazyJobHunt.ai — The agent that hunts while you sleep</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #fafafa; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ======================================================================
   CONSTANTS / DEFAULT DATA
   ====================================================================== */

const STEP_LABELS = ["Auth", "Resume", "Location", "Portals", "Hunting", "ATS + Apply"];

const DEFAULT_LOCATIONS = [
  "Gurgaon, India", "Bangalore, India", "Delhi, India", "Hyderabad, India",
  "Pune, India", "Mumbai, India", "Remote", "USA Remote", "UK Remote",
];

const DEFAULT_PORTALS = [
  { id: "linkedin",    name: "LinkedIn",           letter: "in", color: "#0A66C2" },
  { id: "naukri",      name: "Naukri.com",         letter: "N",  color: "#2758EA" },
  { id: "indeed",      name: "Indeed",             letter: "I",  color: "#003A9B" },
  { id: "glassdoor",   name: "Glassdoor",          letter: "G",  color: "#0CAA41" },
  { id: "foundit",     name: "Foundit (Monster)",  letter: "F",  color: "#FF6B00" },
  { id: "ziprecruiter",name: "ZipRecruiter",       letter: "Z",  color: "#000000" },
  { id: "wellfound",   name: "Wellfound",          letter: "W",  color: "#000000" },
];

const SKILL_SETS = [
  ["React", "TypeScript", "Tailwind", "REST API", "Agile"],
  ["Node.js", "PostgreSQL", "AWS", "Docker", "Microservices"],
  ["Python", "Machine Learning", "Data Pipelines", "SQL", "Tableau"],
  ["Figma", "Design Systems", "User Research", "Prototyping", "Accessibility"],
  ["Sales Strategy", "CRM", "Lead Generation", "Negotiation", "Quota"],
  ["SEO", "Content Strategy", "Google Analytics", "A/B Testing", "Growth"],
];

// Requirement #5: three tiers, owner-editable.
const DEFAULT_PLANS = [
  { id: "free",      name: "Free",      price: 0,  billing: "one-time",  cap: 2,        popular: false },
  { id: "starter",   name: "Starter",   price: 19, billing: "per month", cap: 100,      popular: true  },
  { id: "unlimited", name: "Unlimited", price: 49, billing: "per month", cap: Infinity, popular: false },
];

const OWNER_PASSWORD = "lazyowner123";
const MS_PER_DAY = 24 * 60 * 60 * 1000;

/* ======================================================================
   SMALL HELPERS
   ====================================================================== */

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

function formatCap(plan) {
  if (plan.cap === Infinity) return "Unlimited applications";
  if (plan.billing === "one-time") return plan.cap + " application" + (plan.cap === 1 ? "" : "s") + " (one-time)";
  return plan.cap + " applications / month";
}

/* ======================================================================
   APP
   ====================================================================== */

function App() {
  const [step, setStep] = useState(0);

  // --- Auth ---
  const [user, setUser] = useState(null);
  const [authMode, setAuthMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [authMessage, setAuthMessage] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [firebaseReady, setFirebaseReady] = useState(false);

  // --- Resume ---
  const [resumeFile, setResumeFile] = useState(null);
  const fileInputRef = useRef(null);

  // --- Locations (Step 3 — fixed multi-select) ---
  const [availableLocations, setAvailableLocations] = useState(DEFAULT_LOCATIONS);
  const [selectedLocations, setSelectedLocations] = useState([]);
  const [customLocation, setCustomLocation] = useState("");

  // --- Portals (Step 4) ---
  const [portals, setPortals] = useState(
    DEFAULT_PORTALS.map((p) => ({ ...p, email: "", password: "", connected: false, connecting: false }))
  );
  const connectedCount = portals.filter((p) => p.connected).length;

  // --- Plans / billing (Step 5 requirement) ---
  const [plans, setPlans] = useState(loadJSON("ljh_plans", DEFAULT_PLANS));
  const [planId, setPlanId] = useState(loadJSON("ljh_plan_id", "free"));
  const currentPlan = plans.find((p) => p.id === planId) || plans[0];
  const [usage, setUsage] = useState(loadJSON("ljh_usage", { appliedCount: 0, cycleStart: Date.now() }));
  const [showPricing, setShowPricing] = useState(false);

  // --- Owner mode ---
  const [ownerClicks, setOwnerClicks] = useState(0);
  const [ownerUnlocked, setOwnerUnlocked] = useState(false);
  const [showOwnerLogin, setShowOwnerLogin] = useState(false);
  const [ownerPasswordInput, setOwnerPasswordInput] = useState("");

  // --- Jobs (Step 5) ---
  const [jobs, setJobs] = useState([]);
  const [jobsLoading, setJobsLoading] = useState(false);
  const [selectedJobIds, setSelectedJobIds] = useState([]);

  // --- ATS + Apply (Step 6) ---
  const [applying, setApplying] = useState(false);
  const [applyProgress, setApplyProgress] = useState({});
  const [applyDone, setApplyDone] = useState(false);

  /* ---------- Persist plan / usage ---------- */
  useEffect(() => saveJSON("ljh_plans", plans), [plans]);
  useEffect(() => saveJSON("ljh_plan_id", planId), [planId]);
  useEffect(() => saveJSON("ljh_usage", usage), [usage]);

  // Reset the monthly counter automatically once 30 days have passed
  // (a real product would track this server-side against a Stripe subscription).
  useEffect(() => {
    if (currentPlan.billing === "per month" && Date.now() - usage.cycleStart > 30 * MS_PER_DAY) {
      setUsage({ appliedCount: 0, cycleStart: Date.now() });
    }
  }, [currentPlan]);

  const remainingApplications =
    currentPlan.cap === Infinity ? Infinity : Math.max(0, currentPlan.cap - usage.appliedCount);

  /* ---------- Firebase (optional real Google auth, falls back to demo) ---------- */
  useEffect(() => {
    const w = window;
    const isFileProtocol = w.location.protocol === "file:";

    const initFirebase = () => {
      try {
        if (w.firebase?.apps && !w.firebase.apps.length) {
          w.firebase.initializeApp({
            apiKey: "AIzaSyBty2D18gXpIcO1V6cXcQuLiS1Ow30IUVw",
            authDomain: "lazyjobhunt-ai.firebaseapp.com",
            projectId: "lazyjobhunt-ai",
            storageBucket: "lazyjobhunt-ai.firebasestorage.app",
            messagingSenderId: "12185484183",
            appId: "1:12185484183:web:08a502aaa2692658afa2d2",
          });
        }
        if (w.firebase?.auth) {
          w.firebase.auth().onAuthStateChanged((fbUser) => {
            if (fbUser) {
              setUser({
                email: fbUser.email || "",
                name: fbUser.displayName || (fbUser.email ? fbUser.email.split("@")[0] : "User"),
              });
              setStep((s) => (s === 0 ? 1 : s));
            } else {
              setUser(null);
            }
          });
        }
      } catch {}
      setFirebaseReady(true);
    };

    if (w.firebase?.auth) { initFirebase(); return; }
    if (isFileProtocol) { setFirebaseReady(true); return; }

    const loadScript = (src) => new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = src; s.async = true; s.onload = resolve; s.onerror = resolve;
      document.head.appendChild(s);
    });
    (async () => {
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
      initFirebase();
    })();
  }, []);

  /* ---------- Auth handlers ---------- */
  const handleGoogleSignIn = async () => {
    setAuthMessage("Connecting with Google…");
    setAuthLoading(true);
    try {
      if (window.firebase?.auth) {
        const provider = new window.firebase.auth.GoogleAuthProvider();
        await window.firebase.auth().signInWithPopup(provider);
        setAuthMessage("");
      } else {
        await new Promise((r) => setTimeout(r, 400));
        setUser({ email: "demo@lazyjobhunt.ai", name: "Demo User" });
        setStep(1);
        setAuthMessage("");
      }
    } catch (err) {
      setAuthMessage(err.message || "Google sign-in failed — using demo mode");
      setUser({ email: "demo@lazyjobhunt.ai", name: "Demo User" });
      setStep(1);
    }
    setAuthLoading(false);
  };

  const handleEmailAuth = async () => {
    if (!email || !password) {
      setAuthMessage("Enter an email and password to continue.");
      return;
    }
    setAuthMessage(authMode === "signin" ? "Signing in…" : "Creating account…");
    setAuthLoading(true);
    try {
      if (window.firebase?.auth) {
        if (authMode === "signin") await window.firebase.auth().signInWithEmailAndPassword(email, password);
        else await window.firebase.auth().createUserWithEmailAndPassword(email, password);
        setAuthMessage("");
      } else {
        await new Promise((r) => setTimeout(r, 500));
        setUser({ email, name: email.split("@")[0] });
        setStep(1);
        setAuthMessage("");
      }
    } catch (err) {
      setAuthMessage(err.message || "Authentication failed — switching to demo mode");
      setUser({ email, name: email.split("@")[0] });
      setStep(1);
    }
    setAuthLoading(false);
  };

  const handleLogout = async () => {
    try { await window.firebase?.auth()?.signOut(); } catch {}
    setUser(null);
    setStep(0);
  };

  /* ---------- Location handlers (FIX for issue #1) ---------- */
  const toggleLocation = (loc) => {
    setSelectedLocations((prev) =>
      prev.includes(loc) ? prev.filter((l) => l !== loc) : [...prev, loc]
    );
  };
  const addCustomLocation = () => {
    const value = customLocation.trim();
    if (!value) return;
    setAvailableLocations((prev) => (prev.includes(value) ? prev : [...prev, value]));
    setSelectedLocations((prev) => (prev.includes(value) ? prev : [...prev, value]));
    setCustomLocation("");
  };
  const clearLocations = () => setSelectedLocations([]);

  /* ---------- Portal handlers (FIX for issue #2 — honest, safer version) ---------- */
  const updatePortal = (id, patch) => {
    setPortals((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
  };

  const connectPortal = (id) => {
    const portal = portals.find((p) => p.id === id);
    if (!portal || !portal.email || !portal.password) return;
    updatePortal(id, { connecting: true });
    // Simulated connection: we deliberately never persist the password anywhere
    // (not to localStorage, not to sessionStorage, not sent over the network here).
    // A production build should hand this off to a server-side integration that
    // uses each platform's official OAuth/API, or a backend automation service
    // the user explicitly authorizes — never store third-party passwords in the browser.
    setTimeout(() => {
      updatePortal(id, { connecting: false, connected: true, password: "" });
      try {
        const record = loadJSON("ljh_connected_portals", {});
        record[id] = { email: portal.email, connectedAt: Date.now() };
        sessionStorage.setItem("ljh_connected_portals", JSON.stringify(record));
      } catch {}
    }, 1200);
  };

  const disconnectPortal = (id) => {
    updatePortal(id, { connected: false, email: "", password: "" });
  };

  /* ---------- Jobs (Step 5) ---------- */
  useEffect(() => {
    if (step !== 4) return;
    setJobsLoading(true);
    (async () => {
      let liveJobs = [];
      try {
        const res = await fetch("https://www.arbeitnow.com/api/job-board-api");
        const data = await res.json();
        liveJobs = (data.data || []).slice(0, 8).map((j, i) => ({
          id: "arbeitnow-" + i + "-" + j.slug,
          title: j.title,
          company: j.company_name,
          location: j.location || selectedLocations[0] || "Remote",
          portal: ["LinkedIn", "Indeed", "Glassdoor"][i % 3],
          description: (j.description || j.title || "").slice(0, 160),
          url: j.url,
        }));
      } catch {}

      let remoteJobs = [];
      try {
        const res2 = await fetch("https://remotive.com/api/remote-jobs?limit=8");
        const data2 = await res2.json();
        remoteJobs = (data2.jobs || []).slice(0, 8).map((j, i) => ({
          id: "remotive-" + i + "-" + j.id,
          title: j.title,
          company: j.company_name,
          location: j.candidate_required_location || "Remote",
          portal: "Indeed",
          description: (j.description || j.title || "").replace(/<[^>]+>/g, "").slice(0, 160),
          url: j.url,
        }));
      } catch {}

      // Local mock jobs fill in the rest so the demo still looks complete offline.
      const mockTitles = ["Frontend Engineer", "Full Stack Developer", "Product Designer", "Data Scientist", "DevOps Engineer", "Product Manager"];
      const mockCompanies = ["Razorpay", "Swiggy", "CRED", "Meesho", "PhonePe", "Zepto", "Groww", "Zomato"];
      const mockJobs = [];
      const locs = selectedLocations.length ? selectedLocations : ["Remote"];
      locs.forEach((loc, li) => {
        for (let i = 0; i < 2; i++) {
          const title = mockTitles[(li + i) % mockTitles.length];
          const company = mockCompanies[(li * 2 + i) % mockCompanies.length];
          mockJobs.push({
            id: "mock-" + loc + "-" + i + "-" + li,
            title, company, location: loc,
            portal: DEFAULT_PORTALS[(li + i) % DEFAULT_PORTALS.length].name,
            description: title + " at " + company + " — building scalable products for " + loc + ".",
            url: "#",
          });
        }
      });

      setJobs([...mockJobs, ...liveJobs, ...remoteJobs].slice(0, 24));
      setJobsLoading(false);
    })();
  }, [step]);

  // FIX for issue #3: cap selectable jobs by plan.
  const toggleJobSelection = (id) => {
    setSelectedJobIds((prev) => {
      const already = prev.includes(id);
      if (already) return prev.filter((j) => j !== id);
      const limit = Math.min(remainingApplications, currentPlan.cap === Infinity ? Infinity : currentPlan.cap);
      if (prev.length >= limit) {
        setShowPricing(true);
        return prev;
      }
      return [...prev, id];
    });
  };

  const selectedJobs = useMemo(() => jobs.filter((j) => selectedJobIds.includes(j.id)), [jobs, selectedJobIds]);

  /* ---------- ATS resume generation (Step 6) ---------- */
  const generateAtsResume = (job, index) => {
    const skills = SKILL_SETS[index % SKILL_SETS.length];
    const dateStr = new Date().toISOString().slice(0, 10);
    const safeCompany = job.company.replace(/[^a-zA-Z0-9]/g, "");
    const safeTitle = job.title.replace(/[^a-zA-Z0-9]/g, "_");
    const filename = safeCompany + "_" + safeTitle + "_ATS_Resume_" + dateStr + ".txt";
    const score = 82 + Math.floor(Math.random() * 14);
    const body =
`ATS OPTIMIZED RESUME
Company: ${job.company}
Role: ${job.title}
Location: ${job.location}
Portal: ${job.portal}
Date: ${dateStr}
Score: ${score}%

KEYWORDS INJECTED:
${skills.join(", ")}

EXPERIENCE SUMMARY:
- Built scalable ${job.title} solutions using ${skills.slice(0, 3).join(", ")}
- Optimized ATS keywords: ${skills.join(", ")}
- Original resume enhanced for ${job.company}

Original file: ${resumeFile ? resumeFile.name : "resume.pdf"}
This ATS version is tailored for ${job.title} at ${job.company}.
`;
    const blob = new Blob([body], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };

  const startAutoApply = () => {
    const connectedPortals = portals.filter((p) => p.connected);
    if (!connectedPortals.length || !selectedJobs.length) return;
    setApplying(true);
    setApplyDone(false);
    const progress = {};
    connectedPortals.forEach((p) => (progress[p.id] = 0));
    setApplyProgress(progress);

    const timer = setInterval(() => {
      setApplyProgress((prev) => {
        const next = { ...prev };
        let allDone = true;
        connectedPortals.forEach((p) => {
          if (next[p.id] < 100) {
            next[p.id] = Math.min(100, next[p.id] + Math.random() * 18 + 6);
            if (next[p.id] < 100) allDone = false;
          }
        });
        if (allDone) {
          clearInterval(timer);
          setTimeout(() => {
            setApplying(false);
            setApplyDone(true);
            setUsage((u) => ({ ...u, appliedCount: u.appliedCount + selectedJobs.length }));
          }, 500);
        }
        return next;
      });
    }, 350);
  };

  /* ---------- Owner mode (pricing edit) ---------- */
  const handleLogoClick = () => {
    const next = ownerClicks + 1;
    setOwnerClicks(next);
    setTimeout(() => setOwnerClicks(0), 700);
    if (next >= 3) { setShowOwnerLogin(true); setOwnerClicks(0); }
  };
  const submitOwnerPassword = () => {
    if (ownerPasswordInput === OWNER_PASSWORD) {
      setOwnerUnlocked(true);
      setShowOwnerLogin(false);
      setOwnerPasswordInput("");
    } else {
      setOwnerPasswordInput("");
      alert("Incorrect password.");
    }
  };
  const updatePlanField = (id, field, value) => {
    setPlans((prev) => prev.map((p) => (p.id === id ? { ...p, [field]: value } : p)));
  };

  /* ====================================================================
     RENDER
     ==================================================================== */

  return (
    <div className="min-h-screen text-zinc-900 antialiased">
      <Header
        user={user}
        onLogout={handleLogout}
        onLogoClick={handleLogoClick}
        currentPlan={currentPlan}
        remaining={remainingApplications}
        onOpenPricing={() => setShowPricing(true)}
        ownerUnlocked={ownerUnlocked}
      />

      <div className="mx-auto max-w-[720px] px-4 sm:px-5 py-6 sm:py-8">
        <StepIndicator step={step} />

        {step === 0 && (
          <AuthStep
            authMode={authMode} setAuthMode={setAuthMode}
            email={email} setEmail={setEmail}
            password={password} setPassword={setPassword}
            authMessage={authMessage} authLoading={authLoading}
            onGoogle={handleGoogleSignIn} onEmailAuth={handleEmailAuth}
          />
        )}

        {step === 1 && (
          <ResumeStep
            resumeFile={resumeFile} setResumeFile={setResumeFile}
            fileInputRef={fileInputRef}
            onContinue={() => setStep(2)}
          />
        )}

        {step === 2 && (
          <LocationStep
            availableLocations={availableLocations}
            selectedLocations={selectedLocations}
            customLocation={customLocation} setCustomLocation={setCustomLocation}
            onToggle={toggleLocation} onAddCustom={addCustomLocation} onClear={clearLocations}
            onBack={() => setStep(1)} onContinue={() => setStep(3)}
          />
        )}

        {step === 3 && (
          <PortalStep
            portals={portals} connectedCount={connectedCount}
            onUpdate={updatePortal} onConnect={connectPortal} onDisconnect={disconnectPortal}
            onBack={() => setStep(2)} onContinue={() => setStep(4)} onSkip={() => setStep(4)}
          />
        )}

        {step === 4 && (
          <JobsStep
            jobs={jobs} jobsLoading={jobsLoading}
            selectedJobIds={selectedJobIds} onToggle={toggleJobSelection}
            selectedLocations={selectedLocations} connectedCount={connectedCount}
            currentPlan={currentPlan} remainingApplications={remainingApplications}
            onOpenPricing={() => setShowPricing(true)}
            onBack={() => setStep(3)} onContinue={() => setStep(5)}
          />
        )}

        {step === 5 && (
          <AtsApplyStep
            selectedJobs={selectedJobs} connectedCount={connectedCount} portals={portals}
            applying={applying} applyProgress={applyProgress} applyDone={applyDone}
            onDownload={generateAtsResume} onApply={startAutoApply}
            onFindMore={() => { setSelectedJobIds([]); setApplyDone(false); setStep(4); }}
            onStartOver={() => { setApplyDone(false); setStep(0); setUser(null); }}
            onBack={() => setStep(4)}
          />
        )}
      </div>

      {showPricing && (
        <PricingModal
          plans={plans} planId={planId} setPlanId={setPlanId}
          ownerUnlocked={ownerUnlocked} onUpdatePlanField={updatePlanField}
          onClose={() => setShowPricing(false)}
        />
      )}

      {showOwnerLogin && (
        <OwnerLoginModal
          value={ownerPasswordInput} setValue={setOwnerPasswordInput}
          onSubmit={submitOwnerPassword} onClose={() => setShowOwnerLogin(false)}
        />
      )}

      <div className="mt-8 text-center text-[11px] text-zinc-400 pb-8">
        © LazyJobHunt.ai • Clean • Fast • ATS-First • No spam
      </div>
    </div>
  );
}

/* ======================================================================
   HEADER
   ====================================================================== */

function Header({ user, onLogout, onLogoClick, currentPlan, remaining, onOpenPricing, ownerUnlocked }) {
  return (
    <div className="sticky top-0 z-20 backdrop-blur-xl bg-white/70 border-b border-zinc-200">
      <div className="mx-auto max-w-[720px] px-5 h-[56px] flex items-center justify-between">
        <div className="flex items-center gap-2.5 cursor-pointer select-none" onClick={onLogoClick}>
          <div className="w-7 h-7 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[11px] font-bold tracking-wide">LJ</div>
          <span className="font-semibold text-[14.5px] tracking-tight">LazyJobHunt.ai</span>
          <span className="hidden sm:inline text-[11px] px-2 py-0.5 rounded-full bg-zinc-900 text-white ml-1">BETA</span>
          {ownerUnlocked && <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500 text-white">OWNER</span>}
        </div>
        <div className="flex items-center gap-3">
          <button
            onClick={onOpenPricing}
            className="text-[11.5px] px-3 py-1 rounded-full border border-zinc-200 hover:border-zinc-300 font-medium"
          >
            {currentPlan.name} plan{remaining !== Infinity ? " • " + remaining + " left" : " • Unlimited"}
          </button>
          {user ? (
            <div className="flex items-center gap-3">
              <div className="w-7 h-7 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[11px] font-semibold">
                {user.name[0]?.toUpperCase()}
              </div>
              <button onClick={onLogout} className="text-[12px] text-zinc-500 hover:text-zinc-900 hidden sm:inline">Logout</button>
            </div>
          ) : (
            <span className="text-[11px] text-zinc-400 hidden sm:inline">Secure • Encrypted</span>
          )}
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   STEP INDICATOR
   ====================================================================== */

function StepIndicator({ step }) {
  return (
    <React.Fragment>
      <div className="flex items-center gap-2 mb-6">
        {STEP_LABELS.map((_, i) => (
          <div key={i} className="flex items-center gap-2 flex-1">
            <div className={"h-1.5 rounded-full transition-all " + (i <= step ? "bg-zinc-900" : "bg-zinc-200") + " " + (i === step ? "flex-[1.6]" : "flex-1")} />
          </div>
        ))}
      </div>
      <div className="flex justify-between mb-8">
        <span className="text-[11px] tracking-widest font-medium text-zinc-400 uppercase">
          Step {step + 1} / {STEP_LABELS.length}
        </span>
        <span className="text-[11px] text-zinc-500">{STEP_LABELS[step]}</span>
      </div>
    </React.Fragment>
  );
}

/* ======================================================================
   STEP 1 — AUTH
   ====================================================================== */

function AuthStep({ authMode, setAuthMode, email, setEmail, password, setPassword, authMessage, authLoading, onGoogle, onEmailAuth }) {
  return (

/* ======================================================================
   STEP 2 — RESUME
   ====================================================================== */

function ResumeStep({ resumeFile, setResumeFile, fileInputRef, onContinue }) {
  const handleFile = (file) => { if (file) setResumeFile(file); };
  return (
    <div className="bg-white rounded-[20px] border border-zinc-200 p-6 sm:p-8">
      <h2 className="text-[22px] font-semibold tracking-tight">Upload your resume</h2>
      <p className="text-[13.5px] text-zinc-500 mt-1">PDF or DOCX, max 5MB. We parse skills to match jobs.</p>

      <div
        onClick={() => fileInputRef.current?.click()}
        onDragOver={(e) => e.preventDefault()}
        onDrop={(e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}
        className={"mt-6 border-2 border-dashed rounded-[16px] p-8 flex flex-col items-center justify-center cursor-pointer transition " +
          (resumeFile ? "border-zinc-900 bg-zinc-50" : "border-zinc-200 hover:border-zinc-300 bg-[#fcfcfc]")}
      >
        <div className="w-10 h-10 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[18px]">↑</div>
        <div className="mt-3 text-[14px] font-medium">{resumeFile ? "Resume ready" : "Click or drag to upload"}</div>
        <div className="text-[12px] text-zinc-500 mt-1">{resumeFile ? resumeFile.name : "PDF, DOCX • 5MB max"}</div>
      </div>
      <input ref={fileInputRef} type="file" accept=".pdf,.doc,.docx" className="hidden"
        onChange={(e) => handleFile(e.target.files?.[0] || null)} />

      {resumeFile && (
        <div className="mt-4 rounded-xl bg-zinc-50 border border-zinc-200 p-3 flex items-center gap-3">
          <div className="w-9 h-9 rounded-lg bg-white border border-zinc-200 flex items-center justify-center text-[12px] font-bold">PDF</div>
          <div className="flex-1 min-w-0">
            <div className="text-[13px] font-medium truncate">{resumeFile.name}</div>
            <div className="text-[11px] text-zinc-500">Parsed • Skills detected • Ready for ATS</div>
          </div>
          <div className="text-[11px] text-emerald-600 font-medium">✓</div>
        </div>

      <button
        disabled={!resumeFile}
        onClick={onContinue}
        className={"mt-6 w-full h-11 rounded-full text-[14px] font-medium transition " +

      >
        Continue

    </div>
  );
}

/* ======================================================================
   STEP 3 — LOCATIONS  (fix for "appears prefilled" bug)
   ====================================================================== */

function LocationStep({ availableLocations, selectedLocations, customLocation, setCustomLocation, onToggle, onAddCustom, onClear, onBack, onContinue }) {
  return (
    <div className="bg-white rounded-[20px] border border-zinc-200 p-6 sm:p-8">
      <h2 className="text-[22px] font-semibold tracking-tight">Where should I hunt?</h2>
      <p className="text-[13.5px] text-zinc-500 mt-1">
        Tap a location to select or deselect it. Nothing is chosen for you — pick as many as you like.
      </p>

      <div className="mt-6 flex flex-wrap gap-2">
        {availableLocations.map((loc) => {
          const isSelected = selectedLocations.includes(loc);
          return (
            <button
              key={loc}
              type="button"
              aria-pressed={isSelected}
              onClick={() => onToggle(loc)}
              className={"h-8 px-3.5 rounded-full text-[13px] font-medium border transition " +
                (isSelected ? "bg-zinc-900 text-white border-zinc-900" : "bg-white text-zinc-700 border-zinc-200 hover:border-zinc-300")}
            >
              {loc}
            </button>
          );
        })}
      </div>

      <div className="mt-6 flex gap-2">
        <input
          value={customLocation}
          onChange={(e) => setCustomLocation(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && onAddCustom()}
          placeholder="Add custom e.g. Noida, India"
          className="flex-1 h-10 rounded-full border border-zinc-200 px-4 text-[13.5px] outline-none focus:border-zinc-900"
        />
        <button onClick={onAddCustom} className="h-10 px-5 rounded-full bg-zinc-900 text-white text-[13px] font-medium hover:bg-black">
          Add
        </button>
      </div>

      {selectedLocations.length > 0 && (
        <div className="mt-6 rounded-xl bg-zinc-50 border border-zinc-200 p-3">
          <div className="flex items-center justify-between">
            <div className="text-[11px] uppercase tracking-widest text-zinc-500 font-medium">
              Selected ({selectedLocations.length})
            </div>
            <button onClick={onClear} className="text-[11px] text-zinc-500 hover:text-zinc-900 underline underline-offset-4">
              Clear all
            </button>
          </div>
          <div className="mt-2 flex flex-wrap gap-2">
            {selectedLocations.map((loc) => (
              <span key={loc} className="inline-flex items-center gap-1.5 h-7 px-3 rounded-full bg-zinc-900 text-white text-[12.5px]">
                {loc}
                <button onClick={() => onToggle(loc)} className="ml-1 w-4 h-4 rounded-full bg-white/20 flex items-center justify-center">×</button>
              </span>
            ))}
          </div>
        </div>
      )}

      <div className="mt-6 flex gap-2">
        <button onClick={onBack} className="h-11 px-5 rounded-full border border-zinc-200 text-[13.5px] font-medium">Back</button>
        <button
          disabled={selectedLocations.length === 0}
          onClick={onContinue}
          className={"flex-1 h-11 rounded-full text-[14px] font-medium transition " +
            (selectedLocations.length ? "bg-zinc-900 text-white hover:bg-black" : "bg-zinc-100 text-zinc-400 cursor-not-allowed")}
        >
          Continue • {selectedLocations.length} location{selectedLocations.length !== 1 ? "s" : ""}
        </button>
      </div>
    </div>
  );
}

/* ======================================================================
   STEP 4 — PORTALS
   ====================================================================== */

function PortalStep({ portals, connectedCount, onUpdate, onConnect, onDisconnect, onBack, onContinue, onSkip }) {
  return (
    <div className="bg-white rounded-[20px] border border-zinc-200 p-6 sm:p-8">
      <h2 className="text-[22px] font-semibold tracking-tight">Connect job portals</h2>
      <p className="text-[13.5px] text-zinc-500 mt-1">

        violate that platform's Terms of Service and risks account restrictions. This demo does not store or

        or a backend service you explicitly authorize.

      <div className="mt-4 inline-flex items-center gap-2 h-7 px-3 rounded-full bg-emerald-50 border border-emerald-100 text-[12px] text-emerald-700">

            <div className="flex items-start justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-full flex items-center justify-center text-[12px] font-bold text-white" style={{ background: p.color }}>
                  {p.letter}
                </div>
                <div>
                  <div className="text-[14px] font-medium leading-none flex items-center gap-2">
                    {p.name}
                    {p.connected && <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-600 text-white">Connected ✓</span>}

              <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">

                  onChange={(e) => onUpdate(p.id, { email: e.target.value })}
                  placeholder="Email / Username"
                  className="h-9 rounded-full border border-zinc-200 px-3.5 text-[13px] outline-none focus:border-zinc-900"
                />
                <div className="flex gap-2">
                  <input
                    value={p.password}
                    onChange={(e) => onUpdate(p.id, { password: e.target.value })}
                    placeholder="Password"
                    type="password"
                    className="flex-1 h-9 rounded-full border border-zinc-200 px-3.5 text-[13px] outline-none focus:border-zinc-900"
                  />
                  <button
                    onClick={() => onConnect(p.id)}
                    disabled={!p.email || !p.password || p.connecting}
                    className={"h-9 px-4 rounded-full text-[12.5px] font-medium transition " +
                      (!p.email || !p.password ? "bg-zinc-100 text-zinc-400" : "bg-zinc-900 text-white hover:bg-black")}
                  >
                    {p.connecting ? "Connecting…" : "Connect"}

            {p.connecting && (
              <div className="mt-3 h-1.5 w-full bg-zinc-100 rounded-full overflow-hidden">
                <div className="h-full w-1/2 bg-zinc-900 animate-[pulse_1s_ease-in-out_infinite]" />
              </div>
            )}

        ))}

      <div className="mt-6 flex items-center justify-between">
        <button onClick={onSkip} className="text-[13px] text-zinc-500 hover:text-zinc-900 underline underline-offset-4">Skip for now</button>
        <div className="flex gap-2">
          <button onClick={onBack} className="h-11 px-5 rounded-full border border-zinc-200 text-[13.5px] font-medium">Back</button>
          <button
            onClick={onContinue}
            className="h-11 px-6 rounded-full text-[14px] font-medium transition bg-zinc-900 text-white hover:bg-black"

        </div>
      </div>

/* ======================================================================
   STEP 5 — JOBS  (fix for issue #3: free-tier cap)
   ====================================================================== */

function JobsStep({ jobs, jobsLoading, selectedJobIds, onToggle, selectedLocations, connectedCount, currentPlan, remainingApplications, onOpenPricing, onBack, onContinue }) {
  const limitReached = currentPlan.cap !== Infinity && selectedJobIds.length >= Math.min(currentPlan.cap, remainingApplications);
  return (
    <div className="bg-white rounded-[20px] border border-zinc-200 p-6 sm:p-8">
      <div className="flex items-start justify-between gap-4">
        <div>
          <h2 className="text-[22px] font-semibold tracking-tight">Job hunting</h2>
          <p className="text-[13.5px] text-zinc-500 mt-1">
            Filtered for: {selectedLocations.slice(0, 3).join(", ")}{selectedLocations.length > 3 ? " +" + (selectedLocations.length - 3) : ""} • {connectedCount} portals
          </p>
        </div>
        <div className="text-[11px] px-2.5 py-1 rounded-full bg-zinc-900 text-white">{jobs.length} jobs</div>
      </div>

      <div className="mt-4 rounded-xl border border-zinc-200 bg-zinc-50 p-3 flex items-center justify-between">
        <div className="text-[12.5px] text-zinc-600">
          <span className="font-medium text-zinc-900">{currentPlan.name} plan</span> —{" "}
          {currentPlan.cap === Infinity ? "unlimited applications" : remainingApplications + " application" + (remainingApplications === 1 ? "" : "s") + " remaining"}
        </div>
        {currentPlan.cap !== Infinity && (
          <button onClick={onOpenPricing} className="text-[12px] font-medium text-zinc-900 underline underline-offset-4">Upgrade</button>
        )}
      </div>

      {limitReached && (
        <div className="mt-3 rounded-xl bg-amber-50 border border-amber-200 p-3 text-[12px] text-amber-800">
          You've hit your plan's limit for this batch. <button onClick={onOpenPricing} className="underline font-medium">Upgrade your plan</button> to select more jobs.
        </div>
      )}

      {jobsLoading ? (
        <div className="mt-8 space-y-3">
          {[0, 1, 2].map((i) => <div key={i} className="h-20 rounded-xl bg-zinc-100 animate-pulse" />)}
        </div>
      ) : (
        <div className="mt-6 space-y-2.5 max-h-[52vh] overflow-auto pr-1">
          {jobs.map((job) => {
            const isSelected = selectedJobIds.includes(job.id);
            const disableFurther = !isSelected && limitReached;
            return (
              <label
                key={job.id}
                className={"flex gap-3 p-3.5 rounded-[14px] border transition " +
                  (isSelected ? "border-zinc-900 bg-zinc-50 cursor-pointer" : disableFurther ? "border-zinc-100 bg-zinc-50/50 opacity-60 cursor-not-allowed" : "border-zinc-200 hover:border-zinc-300 bg-white cursor-pointer")}
              >
                <input
                  type="checkbox"
                  checked={isSelected}
                  disabled={disableFurther}
                  onChange={() => onToggle(job.id)}
                  className="mt-1 w-4 h-4 rounded accent-zinc-900"
                />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-[13.5px] font-medium truncate">{job.title}</span>
                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-zinc-900 text-white">{job.portal}</span>
                    <span className="text-[11px] px-2 py-0.5 rounded-full border border-zinc-200">{job.location}</span>
                  </div>
                  <div className="text-[12.5px] text-zinc-500 mt-1">{job.company} • {(job.description || "").slice(0, 90)}</div>
                </div>
              </label>
            );
          })}
        </div>
      )}

      <div className="mt-5 flex gap-2">
        <button onClick={onBack} className="h-11 px-5 rounded-full border border-zinc-200 text-[13.5px] font-medium">Back</button>
        <button
          disabled={selectedJobIds.length === 0}
          onClick={onContinue}
          className={"flex-1 h-11 rounded-full text-[14px] font-medium transition " +
            (selectedJobIds.length ? "bg-zinc-900 text-white hover:bg-black" : "bg-zinc-100 text-zinc-400 cursor-not-allowed")}
        >
          Generate ATS Resumes & Apply • {selectedJobIds.length}
        </button>
      </div>
    </div>
  );
}

/* ======================================================================
   STEP 6 — ATS + APPLY  (fix for issue #4)
   ====================================================================== */

function AtsApplyStep({ selectedJobs, connectedCount, portals, applying, applyProgress, applyDone, onDownload, onApply, onFindMore, onStartOver, onBack }) {
  const avgScore = selectedJobs.length
    ? Math.round(selectedJobs.reduce((sum) => sum + 82 + Math.random() * 14, 0) / selectedJobs.length)
    : 89;
  const connectedPortals = portals.filter((p) => p.connected);

  return (
    <div className="bg-white rounded-[20px] border border-zinc-200 p-6 sm:p-8">
      <div className="flex items-start justify-between">
        <div>
          <h2 className="text-[22px] font-semibold tracking-tight">ATS Optimization Engine</h2>
          <p className="text-[13.5px] text-zinc-500 mt-1">Tailored resumes for each role, optimized for portals.</p>
        </div>
        <div className="text-right">
          <div className="text-[11px] uppercase tracking-widest text-zinc-400">Avg Score</div>
          <div className="text-[20px] font-semibold leading-none mt-1">{avgScore}%</div>
        </div>
      </div>

      <div className="mt-4 grid grid-cols-3 gap-2">
        <StatCard label="Jobs" value={selectedJobs.length} />
        <StatCard label="Avg ATS" value={avgScore + "%"} />
        <StatCard label="Portals" value={connectedPortals.length || 0} />
      </div>

      {connectedPortals.length === 0 && (
        <div className="mt-4 rounded-xl bg-amber-50 border border-amber-200 p-3 text-[12px] text-amber-800">
          No portals connected yet — you can still generate and download ATS resumes, but "Auto-Apply" needs at least one connected portal.
        </div>
      )}

      <div className="mt-6 space-y-3 max-h-[56vh] overflow-auto pr-1">
        {selectedJobs.map((job, i) => {
          const score = 82 + ((i * 7) % 15);
          const skills = SKILL_SETS[i % SKILL_SETS.length];
          const scoreClass = score > 90 ? "text-emerald-600 bg-emerald-50 border-emerald-200" : score > 85 ? "text-amber-600 bg-amber-50 border-amber-200" : "text-zinc-700 bg-zinc-50 border-zinc-200";
          return (
            <div key={job.id} className="rounded-[14px] border border-zinc-200 p-4 bg-white">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[13px] font-medium truncate">{job.company} • {job.title}</div>
                  <div className="mt-2 flex flex-wrap gap-1.5">
                    {skills.map((s) => <span key={s} className="text-[10.5px] px-2 py-0.5 rounded-full bg-zinc-900 text-white">{s}</span>)}
                  </div>
                </div>
                <div className={"text-[12px] font-semibold px-2.5 py-1 rounded-full border " + scoreClass}>{score}% ATS</div>
              </div>
              <div className="mt-3 flex gap-2">
                <button onClick={() => onDownload(job, i)} className="h-8 px-3.5 rounded-full bg-white border border-zinc-200 text-[12px] font-medium hover:bg-zinc-50">
                  Download ATS Resume
                </button>
                <span className="h-8 px-3 rounded-full bg-zinc-50 border border-zinc-200 text-[11px] flex items-center text-zinc-500">Ready to Apply</span>
              </div>
            </div>
          );
        })}
      </div>

      {!applying && !applyDone && (
        <div className="mt-6 flex gap-2">
          <button onClick={onBack} className="h-11 px-5 rounded-full border border-zinc-200 text-[13.5px] font-medium">Back</button>
          <button
            onClick={onApply}
            disabled={connectedPortals.length === 0}
            className={"flex-1 h-11 rounded-full text-[14px] font-medium transition " +
              (connectedPortals.length ? "bg-zinc-900 text-white hover:bg-black" : "bg-zinc-100 text-zinc-400 cursor-not-allowed")}
          >
            Auto-Apply with ATS Resumes
          </button>
        </div>
      )}

      {applying && (
        <div className="mt-6 space-y-3">
          <div className="text-[13px] font-medium">Applying across portals…</div>
          {connectedPortals.map((p) => (
            <div key={p.id} className="space-y-1.5">
              <div className="flex justify-between text-[12px]">
                <span>{p.name}</span>
                <span className="text-zinc-500">{Math.round(applyProgress[p.id] || 0)}%</span>
              </div>
              <div className="h-2 rounded-full bg-zinc-100 overflow-hidden">
                <div className="h-full bg-zinc-900 transition-all" style={{ width: (applyProgress[p.id] || 0) + "%" }} />
              </div>
            </div>
          ))}
        </div>
      )}

      {applyDone && (
        <div className="mt-6 rounded-[16px] bg-zinc-900 text-white p-5 relative overflow-hidden">
          <div className="relative">
            <div className="text-[16px] font-semibold">Applied to {selectedJobs.length} jobs across {connectedPortals.length || 1} portals</div>
            <div className="text-[13px] text-zinc-300 mt-1">ATS resumes used • Tracking enabled • You'll hear back soon.</div>
            <div className="mt-4 flex gap-2">
              <button onClick={onFindMore} className="h-9 px-4 rounded-full bg-white text-zinc-900 text-[13px] font-medium">Find More Jobs</button>
              <button onClick={onStartOver} className="h-9 px-4 rounded-full bg-zinc-800 text-white text-[13px] font-medium">Start Over</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function StatCard({ label, value }) {

    <div className="rounded-xl bg-zinc-50 border border-zinc-200 p-3">
      <div className="text-[11px] text-zinc-500 uppercase tracking-widest">{label}</div>
      <div className="text-[18px] font-semibold mt-1">{value}</div>
    </div>
  );
}

        <div className="flex items-start justify-between">
          <div>
            <h3 className="text-[20px] font-semibold tracking-tight">Choose a plan</h3>

          <button onClick={onClose} className="text-zinc-400 hover:text-zinc-900 text-[18px] leading-none">×</button>
        </div>

        <div className="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-3">
          {plans.map((plan) => (
            <div
              key={plan.id}
              className={"rounded-[16px] border p-4 flex flex-col " +
                (planId === plan.id ? "border-zinc-900 bg-zinc-50" : "border-zinc-200") +
                (plan.popular ? " ring-2 ring-zinc-900/10" : "")}
            >
              {plan.popular && <div className="text-[10px] font-semibold text-zinc-900 uppercase tracking-widest mb-1">Most popular</div>}
              <div className="text-[14px] font-semibold">{plan.name}</div>

              {ownerUnlocked ? (
                <div className="mt-2 flex items-center gap-1 text-[20px] font-bold">
                  $<input
                    type="number"
                    value={plan.price}
                    onChange={(e) => onUpdatePlanField(plan.id, "price", Number(e.target.value))}
                    className="w-14 border-b border-zinc-300 outline-none text-[20px] font-bold"
                  />
                </div>
              ) : (
                <div className="mt-2 text-[24px] font-bold">${plan.price}</div>
              )}
              <div className="text-[11px] text-zinc-500">{plan.billing}</div>

              {ownerUnlocked ? (
                <div className="mt-3 text-[12px] text-zinc-600 flex items-center gap-1">
                  cap:
                  <input
                    type="text"
                    value={plan.cap === Infinity ? "unlimited" : plan.cap}
                    onChange={(e) => {
                      const v = e.target.value.trim().toLowerCase();
                      onUpdatePlanField(plan.id, "cap", v === "unlimited" ? Infinity : Number(v) || 0);
                    }}
                    className="w-20 border-b border-zinc-300 outline-none text-[12px]"
                  />
                </div>
              ) : (
                <div className="mt-3 text-[12px] text-zinc-600 flex-1">{formatCap(plan)}</div>
              )}

              <button
                onClick={() => { setPlanId(plan.id); onClose(); }}
                className={"mt-4 h-9 rounded-full text-[12.5px] font-medium transition " +
                  (planId === plan.id ? "bg-zinc-200 text-zinc-500 cursor-default" : "bg-zinc-900 text-white hover:bg-black")}
              >
                {planId === plan.id ? "Current plan" : "Choose " + plan.name}
              </button>
            </div>
          ))}
        </div>

        <p className="text-[11px] text-zinc-400 mt-5 leading-relaxed">
          Demo only — selecting a paid plan here does not charge a card. Wire this button up to Stripe
          Checkout (or your billing provider of choice) before going live, and track usage against the
          subscription server-side rather than in the browser.
        </p>
      </div>
    </div>
  );
}

/* ======================================================================
   OWNER LOGIN MODAL
   ====================================================================== */

function OwnerLoginModal({ value, setValue, onSubmit, onClose }) {
  return (
    <div className="fixed inset-0 z-30 flex items-center justify-center bg-black/40 p-4" onClick={onClose}>
      <div className="bg-white rounded-[20px] max-w-[360px] w-full p-6" onClick={(e) => e.stopPropagation()}>
        <h3 className="text-[16px] font-semibold">Owner access</h3>
        <p className="text-[12px] text-zinc-500 mt-1">Enter the owner password to edit pricing.</p>
        <input
          type="password"
          autoFocus
          value={value}
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && onSubmit()}
          className="mt-4 w-full h-10 rounded-full border border-zinc-200 px-4 text-[13px] outline-none focus:border-zinc-900"
          placeholder="Password"
        />
        <div className="mt-4 flex gap-2">
          <button onClick={onClose} className="flex-1 h-9 rounded-full border border-zinc-200 text-[12.5px] font-medium">Cancel</button>
          <button onClick={onSubmit} className="flex-1 h-9 rounded-full bg-zinc-900 text-white text-[12.5px] font-medium hover:bg-black">Unlock</button>
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   MOUNT
   ====================================================================== */

ReactDOM.createRoot(document.getElementById("root")).render(
  <React.StrictMode><App /></React.StrictMode>
);
</script>

<script>
  // Open external links in a new tab.
  (function () {
    function fix(a) {
      const href = a.getAttribute("href");
      if (!href) return;
      try {
        const u = new URL(href, document.baseURI);
        if ((u.protocol === "http:" || u.protocol === "https:") && u.host !== location.host) {
          a.target = "_blank"; a.rel = "noopener noreferrer";
        }
      } catch (e) {}
    }
    function run() { document.querySelectorAll("a[href]").forEach(fix); }
    if (document.readyState !== "loading") run();
    else document.addEventListener("DOMContentLoaded", run);
  })();
</script>
